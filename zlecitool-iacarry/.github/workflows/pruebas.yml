# Las pruebas de la herramienta (su check_tool incluido) en cada push y pull
# request. El núcleo se clona al lado, como en desarrollo (requirements-dev.txt
# lo instala desde ../zlecitool-core):
#
# * en develop y en los pull request, el develop del núcleo: lo que se rompa
#   entre los dos se ve antes de sacar versión;
# * en main, la versión fijada en requirements.txt (@vX.Y.Z), la de producción.
#
# El núcleo es privado: hace falta el secreto ZLECITOOL_CORE_TOKEN (un token
# de GitHub con permiso de lectura de Contents sobre Leci37/zlecitool-core).
name: pruebas

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_TOKEN: ${{ secrets.ZLECITOOL_CORE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: tool
      - name: Qué núcleo
        id: core
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            ref=$(grep -o 'zlecitool-core@v[0-9][0-9.]*' tool/requirements.txt | cut -d@ -f2)
          else
            ref=develop
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Núcleo: $ref"
      - name: Falta el token del núcleo
        if: ${{ env.CORE_TOKEN == '' }}
        run: |
          echo "::error::Falta el secreto ZLECITOOL_CORE_TOKEN (lectura de Leci37/zlecitool-core): Settings → Secrets and variables → Actions"
          exit 1
      - uses: actions/checkout@v5
        with:
          repository: Leci37/zlecitool-core
          ref: ${{ steps.core.outputs.ref }}
          token: ${{ secrets.ZLECITOOL_CORE_TOKEN }}
          path: zlecitool-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tool/requirements*.txt
            zlecitool-core/pyproject.toml
      - name: Dependencias
        working-directory: tool
        run: python -m pip install -r requirements-dev.txt
      - name: Chromium para los PDF
        run: python -m playwright install --with-deps chromium
      - name: pytest
        working-directory: tool
        run: python -m pytest -q -rs
